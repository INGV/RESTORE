[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restore"
version = "3.0.0"
description = "RESTORE: stochastic replenishment of earthquake catalogs affected by short term aftershock incompleteness (STAI)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Angela Stallone" },
  { name = "Giuseppe Falcone" },
]
dependencies = [
  "basemap>=1.4,<3",
  "matplotlib>=3.7,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
]

[project.scripts]
restore = "Run_RESTORE:main"

[tool.setuptools]
py-modules = ["RESTORE", "Run_RESTORE", "config", "mc_lilliefors"]
